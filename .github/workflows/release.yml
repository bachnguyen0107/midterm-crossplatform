name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to (re)deploy, e.g. v1.0.0 (rollback)'
        required: true
        type: string

env:
  TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  approve-release:
    needs: test-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Release $TAG approved by a required reviewer"

  build-android:
    needs: approve-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Decode keystore and create key.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks
          cat << EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF
      - name: Build signed release APK (version from tag)
        run: |
          VERSION="${TAG#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ env.TAG }}
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    needs: approve-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build web (version from tag)
        run: |
          VERSION="${TAG#v}"
          flutter build web --release \
            --base-href /midterm-crossplatform/ \
            --dart-define=APP_VERSION="$VERSION"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4