workflows:
  flutter-release-build:
    name: Flutter Release APK Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Android keystore and key.properties
        script: |
            echo $CM_KEYSTORE | base64 --decode > android/app/release-key.jks
            cat <<EOF > android/key.properties
            storePassword=$CM_STORE_PASS
            keyPassword=$CM_KEY_PASS
            keyAlias=$CM_KEY_ALIAS
            storeFile=release-key.jks
            EOF
      - name: Get Flutter dependencies
        script: |
              flutter pub get
      - name: Analyze code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build Debug APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
